name: tazaxy

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tazaxy-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '3001:3000'
    # Lets the container address a natively-installed PostgreSQL on the host.
    # Without this the only route to the host is the bridge gateway IP, and
    # `127.0.0.1` in DATABASE_URL would resolve to this container instead.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - tazaxy-network

    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    ports:
      - '3002:6379'
    networks:
      - tazaxy-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - tazaxy-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/nginx/certs
    ports:
      - '30003:80'
      - '30004:443'
    networks:
      - tazaxy-network
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  tazaxy-network:
    external: true
    name: tazaxy-network


volumes:
  redis-data:
    name: tazaxy-redis-data
  minio-data:
    name: tazaxy-minio-data
  nginx-certs:
    name: tazaxy-nginx-certs
